# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    # This is a library: only widen a range when the new version is outside
    # it, so routine bumps don't raise the floors apps inherit.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      time: "04:00"
    # pnpm 11+ rejects versions published less than a day ago, so don't
    # propose them before then.
    cooldown:
      default-days: 1
    # Dependabot's own labels, which these replace, plus release-plan's.
    labels:
      - dependencies
      - javascript
      - internal
    # One PR for each kind of update instead of one per package. Majors
    # stay apart, as they're the ones that need code changes.
    groups:
      npm:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "04:00"
    cooldown:
      default-days: 1
    labels:
      - dependencies
      - github_actions
      - internal
    groups:
      github-actions:
        patterns:
          - "*"
